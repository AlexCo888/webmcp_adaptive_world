  react-dom: ^19.2.0
  typescript: ^5.9.2
  zod: ^4.1.5

overrides:
  esbuild@<=0.24.2: 0.25.12

allowBuilds:
  esbuild: true
  sharp: true

minimumReleaseAgeExclude:
