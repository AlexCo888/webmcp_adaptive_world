name: Temporary type-check diagnostics

on:
  push:
    branches: [feat/webmcp-agent-routines-receipts]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/webmcp-agent-routines-receipts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture type-check diagnostics
        shell: bash
        run: |
          set +e
          pnpm typecheck > TYPECHECK_DIAGNOSTICS.txt 2>&1
          status=$?
          echo "TYPECHECK_EXIT_CODE=$status" >> TYPECHECK_DIAGNOSTICS.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TYPECHECK_DIAGNOSTICS.txt
          git commit -m "chore: capture temporary type-check diagnostics"
          git push origin HEAD:feat/webmcp-agent-routines-receipts
